<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2f6ee" />
  <script>
    (() => {
      let temaSalvo = null;

      try {
        temaSalvo = localStorage.getItem('portfolio:tema');
      } catch {
        temaSalvo = null;
      }

      const temaSistemaEscuro = matchMedia(
        '(prefers-color-scheme: dark)',
      ).matches;
      const temaAtivo =
        temaSalvo === 'claro' || temaSalvo === 'escuro'
          ? temaSalvo
          : temaSistemaEscuro
            ? 'escuro'
            : 'claro';

      document.documentElement.dataset.tema = temaAtivo;
      document.documentElement.style.colorScheme =
        temaAtivo === 'escuro' ? 'dark' : 'light';
      document
        .querySelector('meta[name="theme-color"]')
        ?.setAttribute('content', temaAtivo === 'escuro' ? '#1d1624' : '#f2f6ee');
    })();
  </script>
  <script>
    (() => {
      const idiomas = ['pt', 'en', 'es', 'fr', 'de'];
      const idiomasHtml = {
        pt: 'pt-BR',
        en: 'en',
        es: 'es',
        fr: 'fr',
        de: 'de',
      };
      let idiomaSalvo = null;

      try {
        idiomaSalvo = localStorage.getItem('portfolio:idioma');
      } catch {
        idiomaSalvo = null;
      }

      const preferencias = navigator.languages?.length
        ? navigator.languages
        : [navigator.language];
      const idiomaNavegador = preferencias
        .map((preferencia) => preferencia.toLowerCase().split('-')[0])
        .find((idioma) => idiomas.includes(idioma));
      const idiomaAtivo = idiomas.includes(idiomaSalvo)
        ? idiomaSalvo
        : idiomaNavegador ?? 'pt';

      document.documentElement.lang = idiomasHtml[idiomaAtivo];
    })();
  </script>
  <script>
    (() => {
      const preferenciasPadrao = {
        reduzirMovimento: false,
        pausarAnimacoes: false,
        contrasteReforcado: false,
        destacarLinks: false,
      };
      let preferencias = preferenciasPadrao;

      try {
        preferencias = {
          ...preferenciasPadrao,
          ...JSON.parse(
            localStorage.getItem('portfolio:acessibilidade') ?? '{}',
          ),
        };
      } catch {
        preferencias = preferenciasPadrao;
      }

      const movimentoReduzido =
        preferencias.reduzirMovimento === true ||
        matchMedia('(prefers-reduced-motion: reduce)').matches;

      document.documentElement.dataset.reduzirMovimento = movimentoReduzido
        ? 'true'
        : 'false';
      document.documentElement.dataset.pausarAnimacoes =
        preferencias.pausarAnimacoes === true ? 'true' : 'false';
      document.documentElement.dataset.contrasteReforcado =
        preferencias.contrasteReforcado === true ? 'true' : 'false';
      document.documentElement.dataset.destacarLinks =
        preferencias.destacarLinks === true ? 'true' : 'false';
    })();
  </script>
